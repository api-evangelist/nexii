aid: nexii
name: Nexii
description: 'Nexii is a green construction technology company that designs and manufactures
  prefabricated wall and roof panel systems for commercial and industrial buildings.
  Its panels are made from Nexiite, a proprietary low-carbon building material the
  company says is up to 80% lighter than conventional concrete, and bolt together on
  site to cut build times by as much as five times while producing near-zero construction
  waste. Nexii serves retail, residential, warehouse, data center, cold storage, healthcare,
  office and education verticals, with projects for Starbucks, McDonald''s, Pizza Hut,
  Popeyes, Dutch Bros, Walmart and Marriott. The original Vancouver-based Nexii Building
  Solutions entered creditor protection in January 2024; Dallas-based 3 Gates acquired
  its assets in a court-approved sale completed 28 June 2024 and relaunched the business
  as NEXII, Inc., headquartered in Dallas, Texas with manufacturing in Squamish, British
  Columbia. Nucor Corporation subsequently made a strategic equity investment. Nexii
  is a manufacturer, not a software vendor: it publishes no developer portal, API
  documentation, or machine-readable API contract.'
